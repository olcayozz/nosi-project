<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Defteri</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">Not Defteri</h1>
                <button class="btn-new" id="btnNew" aria-label="Yeni not">+</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Notlarda ara...">
            </div>
            <ul class="note-list" id="noteList"></ul>
            <div class="sidebar-footer">
                <span id="noteCount">0 not</span>
            </div>
        </aside>
        <main class="editor">
            <div class="editor-header">
                <input type="text" id="noteTitle" placeholder="Not başlığı..." autocomplete="off">
                <div class="editor-actions">
                    <span class="save-status" id="saveStatus"></span>
                    <button class="btn-delete" id="btnDelete" aria-label="Notu sil">Sil</button>
                </div>
            </div>
            <textarea id="noteContent" placeholder="Notunuzu buraya yazın..."></textarea>
        </main>
    </div>
    <script src="./script.js"></script>
</body>
</html>
